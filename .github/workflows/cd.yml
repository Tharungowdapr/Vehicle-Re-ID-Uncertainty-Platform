name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lower-case image name and sanitize repository
        id: meta
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]')
          REPO_CLEAN=$(echo "$REPO_LOWER" | sed 's|/[-_.]|/|g' | sed 's|[-_.]$||g')
          IMAGE="ghcr.io/${REPO_CLEAN}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
        continue-on-error: true   # non-blocking – review vulnerabilities in the summary

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: spdx-json
        continue-on-error: true
